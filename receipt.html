<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Receipt</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center">Booking Receipt</h2>
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">Thank you for booking, <span id="userName"></span>!</h4>
        <p class="card-text">Movie: <strong><span id="movieDetails"></span></strong></p>
        <p class="card-text">Show Time: <strong><span id="showTime"></span></strong></p> <!-- Added this line -->
        <p class="card-text">Seats Selected: <strong><span id="selectedSeats"></span></strong></p>
        <p class="card-text">Total Price: <strong><span id="totalPrice"></span></strong></p>
        <p class="card-text">Your booking has been successfully confirmed.</p>
        <a href="form.html" class="btn btn-primary">Book Another Ticket</a>
      </div>
    </div>
  </div><script src="script.js"></script>
<center><img src="https://thumbs.dreamstime.com/b/cinema-ticket-template-red-realistic-movie-tickets-isolated-white-background-vector-cinema-ticket-template-red-realistic-110648129.jpg" width="300" height="300"></center>

</body>
</html>
