<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Form</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center">User Details</h2>
    <form id="userForm">
      <div class="form-group">
        <label for="firstName">First Name:</label>
        <input type="text" class="form-control" id="firstName" required>
      </div>
      <div class="form-group">
        <label for="lastName">Last Name:</label>
        <input type="text" class="form-control" id="lastName" required>
      </div>
      <div class="form-group">
        <label for="movie">Movie Name</label>
        <select class="form-control" id="movie" required>
          <option value="Jigra">Jigra</option>
          <option value="Martin">Martin</option>
          <option value="Devara">Devara</option>
          <option value="Yek Number">Yek Number</option>
        </select>
      </div>
      <div class="form-group">
        <label for="showTime">Show Time</label>
        <select class="form-control" id="showTime" required>
          <option value="11:30 am to 2:30 pm">11:30 am to 2:30 pm</option>
          <option value="3:30 pm to 6:30 pm">3:30 pm to 6:30 pm</option>
          <option value="7:30 pm to 10:30 pm">7:30 pm to 10:30 pm</option>
        </select>
      </div>
      <div class="form-group">
        <label for="email">Email ID:</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="form-group">
        <label for="paymentMethod">Payment Method:</label>
        <select class="form-control" id="paymentMethod" required>
          <option value="Credit Card">Credit Card</option>
          <option value="Debit Card">Debit Card</option>
          <option value="PayPal">PayPal</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Submit</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
